name: Playwright workflow call

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to run tests: DEV, QA"
        default: "DEV"
        type: string
      project:
        description: "Project to run tests: all, chromium"
        default: "all"
        type: string
      testsuites:
        description: "Testsuites to run. Use space to separate multiple testsuites. Testsuites can be a file `tests/todo-page.spec.ts` or folders `tests/todo-page/ tests/landing-page/`"
        default: "*"
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      project-matrix: ${{ steps.set.outputs.project-matrix }}
    steps:
      - name: Set project matrix based on input
        id: set
        run: |
          if [[ "${{ inputs.project }}" == "all" ]]; then
            echo 'project-matrix=["chromium"]' >> $GITHUB_OUTPUT
          else
            echo "project-matrix=[\"${{ inputs.project }}\"]" >> $GITHUB_OUTPUT
          fi

  playwright-tests:
    needs: prepare
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.prepare.outputs.project-matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright ${{ matrix.project }} tests
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          TEST_ENV: ${{ inputs.environment }}
          TEST_SUITES: ${{ inputs.testsuites }}
          DISPLAY: :99
        run: |
          echo "Running with TEST_ENV=$TEST_ENV and TEST_SUITES=$TEST_SUITES"
          npx playwright test --project=${{ matrix.project }} --reporter html $TEST_SUITES

      - name: Upload ${{ matrix.project }} report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

  notify-telegram:
    needs: playwright-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ needs.playwright-tests.result }}
        run: |
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅ SUCCESS"
          elif [ "$STATUS" = "failure" ]; then
            EMOJI="❌ FAILURE"
          else
            EMOJI="⚠️ $STATUS"
          fi

          MESSAGE="$EMOJI *Playwright Automation Test Report*

          • *Repository:* \`${{ github.repository }}\`
          • *Branch:* \`${{ github.ref_name }}\`
          • *Environment:* \`${{ inputs.environment }}\`
          • *Triggered by:* \`${{ github.actor }}\`
          • *Details:* [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=Markdown"